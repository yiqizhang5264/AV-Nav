[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "av-nav"
version = "0.1.0"
description = "Budget-constrained active verification experiments on pinned VLFM"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23,<2"]

[tool.setuptools.packages.find]
include = ["av_nav*"]
